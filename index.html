<script>

/* =========================================================
   ELEMENTS
========================================================= */

const welcome =
    document.getElementById(
        "welcome"
    );

const site =
    document.getElementById(
        "site"
    );

const audio =
    document.getElementById(
        "music"
    );

const canvas =
    document.getElementById(
        "visualizer"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


/* =========================================================
   AUDIO VARIABLES
========================================================= */

let audioContext = null;

let analyser = null;

let source = null;

let frequencyData = null;

let audioStarted = false;

let audioStarting = false;


/* =========================================================
   TRACK SELECTION
   70% TRACK 1
   30% TRACK 2
========================================================= */

function chooseTrack() {

    return Math.random() < .70
        ? "track1.mp3"
        : "track2.mp3";
}


/* =========================================================
   AUDIO SETUP
========================================================= */

function setupAudio() {

    if (audioContext) {
        return true;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        console.warn(
            "Web Audio API unavailable."
        );

        return false;
    }


    try {

        audioContext =
            new AudioContext();


        analyser =
            audioContext.createAnalyser();


        /*
            Enough detail for the
            visualizer without excessive
            CPU usage.
        */

        analyser.fftSize =
            1024;


        /*
            Smooth audio response.
        */

        analyser.smoothingTimeConstant =
            .86;


        analyser.minDecibels =
            -90;

        analyser.maxDecibels =
            -8;


        frequencyData =
            new Uint8Array(
                analyser.frequencyBinCount
            );


        /*
            AUDIO PIPELINE

            audio
                ↓
            analyser
                ↓
            speakers
        */

        source =
            audioContext
                .createMediaElementSource(
                    audio
                );


        source.connect(
            analyser
        );


        analyser.connect(
            audioContext.destination
        );


        return true;

    } catch (error) {

        console.error(
            "Audio initialization error:",
            error
        );

        return false;
    }
}


/* =========================================================
   FADE IN
========================================================= */

function fadeInMusic() {

    const start =
        performance.now();

    const duration =
        500;


    function fade(
        timestamp
    ) {

        const progress =
            Math.min(
                1,
                (
                    timestamp -
                    start
                ) /
                duration
            );


        /*
            Smooth ease-out.
        */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        audio.volume =
            .72 *
            eased;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                fade
            );

        } else {

            audio.volume =
                .72;
        }
    }


    requestAnimationFrame(
        fade
    );
}


/* =========================================================
   START MUSIC
========================================================= */

async function startMusic() {

    if (
        audioStarted ||
        audioStarting
    ) {

        return;
    }


    audioStarting =
        true;


    /*
        Pick the track once.
    */

    audio.src =
        chooseTrack();


    /*
        Setup Web Audio before
        calling play().
    */

    const ready =
        setupAudio();


    if (!ready) {

        audioStarting =
            false;

        return;
    }


    try {

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();
        }


        audio.volume =
            0;


        await audio.play();


        audioStarted =
            true;

        audioStarting =
            false;


        fadeInMusic();

    } catch (error) {

        audioStarting =
            false;

        console.warn(
            "Audio playback was blocked:",
            error
        );
    }
}


/* =========================================================
   ENTER
========================================================= */

let entered = false;


function enterSite() {

    if (entered) {
        return;
    }


    entered = true;


    site.classList.add(
        "visible"
    );


    welcome.classList.add(
        "hidden"
    );


    /*
        IMPORTANT:
        startMusic() happens directly
        from the user's click.
    */

    startMusic();


    resizeCanvas();


    requestAnimationFrame(
        visualizerLoop
    );
}


welcome.addEventListener(
    "click",
    enterSite
);


/* =========================================================
   CANVAS
========================================================= */

let dpr = 1;


function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    /*
        Cap DPR at 2.

        This prevents expensive
        3x/4x canvas rendering on
        high-density phones.
    */

    dpr =
        Math.min(
            window.devicePixelRatio ||
            1,
            2
        );


    canvas.width =
        Math.max(
            1,
            Math.round(
                rect.width *
                dpr
            )
        );


    canvas.height =
        Math.max(
            1,
            Math.round(
                rect.height *
                dpr
            )
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* =========================================================
   BAR STATE
========================================================= */

let barValues = [];

let barVelocity = [];


function initializeBars(
    count
) {

    barValues =
        new Array(count)
            .fill(.03);

    barVelocity =
        new Array(count)
            .fill(0);
}


/* =========================================================
   SMOOTH SPRING
========================================================= */

function updateBar(
    index,
    target
) {

    if (
        barValues[index] ===
        undefined
    ) {

        barValues[index] =
            .03;

        barVelocity[index] =
            0;
    }


    /*
        Smooth but noticeable bounce.
    */

    const stiffness =
        .105;

    const damping =
        .79;


    const difference =
        target -
        barValues[index];


    barVelocity[index] +=
        difference *
        stiffness;


    barVelocity[index] *=
        damping;


    barValues[index] +=
        barVelocity[index];


    if (
        barValues[index] < 0
    ) {

        barValues[index] = 0;
    }


    return barValues[index];
}


/* =========================================================
   VISUALIZER
========================================================= */

function visualizerLoop(
    timestamp
) {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Fluid number of bars.

        Desktop:
        ~40–58

        Phone:
        ~28–40
    */

    const count =
        Math.max(
            28,
            Math.min(
                58,
                Math.floor(
                    width / 32
                )
            )
        );


    if (
        barValues.length !==
        count
    ) {

        initializeBars(
            count
        );
    }


    if (
        analyser &&
        frequencyData
    ) {

        analyser.getByteFrequencyData(
            frequencyData
        );


        drawAudioBars(
            width,
            height,
            count
        );

    } else {

        drawIdleBars(
            width,
            height,
            count
        );
    }


    /*
        requestAnimationFrame follows
        the actual monitor refresh rate.
    */

    requestAnimationFrame(
        visualizerLoop
    );
}


/* =========================================================
   AUDIO BARS
========================================================= */

function drawAudioBars(
    width,
    height,
    count
) {

    const bins =
        frequencyData.length;


    const gap =
        Math.max(
            4,
            width /
            count *
            .20
        );


    const barWidth =
        Math.max(
            6,
            (
                width -
                gap *
                (count - 1)
            ) /
            count
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const position =
            i /
            (count - 1);


        /*
            Frequency mapping.
        */

        const bin =
            Math.floor(
                Math.pow(
                    position,
                    1.42
                ) *
                (bins - 1)
            );


        let level =
            frequencyData[bin] /
            255;


        /*
            Neighbor averaging.
        */

        const left =
            frequencyData[
                Math.max(
                    0,
                    bin - 3
                )
            ] / 255;


        const right =
            frequencyData[
                Math.min(
                    bins - 1,
                    bin + 3
                )
            ] / 255;


        level =
            level * .62 +
            left * .19 +
            right * .19;


        /*
            Boost quieter frequencies.
        */

        const target =
            Math.pow(
                level,
                .70
            );


        const energy =
            updateBar(
                i,
                target
            );


        const barHeight =
            Math.max(
                7,
                height *
                (
                    .045 +
                    energy *
                    .88
                )
            );


        const x =
            i *
            (
                barWidth +
                gap
            );


        const y =
            height -
            barHeight;


        drawBar(
            x,
            y,
            barWidth,
            barHeight,
            energy,
            i
        );
    }
}


/* =========================================================
   IDLE BARS
========================================================= */

function drawIdleBars(
    width,
    height,
    count
) {

    const gap =
        Math.max(
            4,
            width /
            count *
            .20
        );


    const barWidth =
        Math.max(
            6,
            (
                width -
                gap *
                (count - 1)
            ) /
            count
        );


    const time =
        performance.now() *
        .0013;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const wave =
            (
                Math.sin(
                    time +
                    i * .32
                ) +
                1
            ) /
            2;


        const target =
            .035 +
            wave *
            .065;


        const energy =
            updateBar(
                i,
                target
            );


        const barHeight =
            height *
            (
                .04 +
                energy *
                .7
            );


        const x =
            i *
            (
                barWidth +
                gap
            );


        const y =
            height -
            barHeight;


        drawBar(
            x,
            y,
            barWidth,
            barHeight,
            energy,
            i
        );
    }
}


/* =========================================================
   GLOWING ROUNDED BAR
========================================================= */

function drawBar(
    x,
    y,
    width,
    height,
    energy,
    index
) {

    /*
        Rounded corners.
    */

    const radius =
        Math.min(
            width * .28,
            9
        );


    /*
        -----------------------------------------------------
        SOFT GLOW
        -----------------------------------------------------

        The glow is tied to audio
        intensity.

        Quiet bars = almost no glow.
        Loud bars = stronger glow.
    */

    const glow =
        3 +
        energy * 13;


    const glowAlpha =
        .10 +
        energy * .24;


    ctx.save();


    ctx.shadowColor =
        `rgba(
            255,
            255,
            255,
            ${glowAlpha}
        )`;


    ctx.shadowBlur =
        glow;


    ctx.fillStyle =
        `rgba(
            255,
            255,
            255,
            ${.14 + energy * .62}
        )`;


    ctx.beginPath();


    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );


    ctx.fill();


    ctx.restore();


    /* =====================================================
       CORRUPTED CUT
    ===================================================== */

    if (
        energy > .24 &&
        height > 22
    ) {

        const glitch =
            Math.sin(
                index * 17.31 +
                Math.floor(
                    performance.now() *
                    .007
                )
            );


        if (
            glitch > .72
        ) {

            const cutHeight =
                Math.max(
                    1,
                    height * .016
                );


            const cutY =
                y +
                height *
                (
                    .28 +
                    (
                        glitch + 1
                    ) /
                    2 *
                    .48
                );


            /*
                Actual cut in the bar.
            */

            ctx.clearRect(
                x,
                cutY,
                width *
                (
                    .35 +
                    energy * .5
                ),
                cutHeight
            );
        }
    }


    /* =====================================================
       SMALL GLITCH FRAGMENT
    ===================================================== */

    if (
        energy > .43
    ) {

        const glitch =
            Math.sin(
                index * 41.73 +
                Math.floor(
                    performance.now() *
                    .005
                )
            );


        if (
            glitch > .84
        ) {

            ctx.save();


            ctx.shadowColor =
                `rgba(
                    255,
                    255,
                    255,
                    .18
                )`;


            ctx.shadowBlur =
                5;


            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${.16 + energy * .35}
                )`;


            ctx.fillRect(
                x -
                width * .16,

                y +
                height * .20,

                width *
                .52,

                Math.max(
                    1,
                    height * .012
                )
            );


            ctx.restore();
        }
    }
}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    resizeCanvas
);


/* =========================================================
   AUDIO RECOVERY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState !==
            "visible"
        ) {
            return;
        }


        if (
            audioContext &&
            audioContext.state ===
            "suspended"
        ) {

            try {

                await audioContext.resume();

            } catch (_) {}
        }
    }
);

</script>
