    <style>
    @font-face {font-family: 'Highcrest';src: url('Highcrest.ttf') format('truetype');}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {background: #000;font-family: 'Highcrest', sans-serif;min-height: 100vh;display: flex;flex-direction: column;align-items: center;justify-content: center;gap: 24px;padding: 32px;}
    h1 {font-size: clamp(52px, 12vw, 120px);letter-spacing: -0.02em;line-height: 1;background: linear-gradient(135deg, #fff 0%, #aaa 40%, #fff 60%, #888 100%);background-size: 300% 300%;-webkit-background-clip: text;-webkit-text-fill-color: transparent;background-clip: text;filter: drop-shadow(0 0 24px rgba(255,255,255,0.15)); animation: shimmer 6s ease infinite, fadeUp 0.9s ease both;}
    p {font-size: 15px;color: #555;letter-spacing: 0.08em;text-align: center;animation: fadeUp 1.1s ease both;}
@keyframes shimmer {0%,100% { background-position: 0% 50%; }50%      { background-position: 100% 50%; }}
@keyframes fadeUp {from { opacity: 0; transform: translateY(16px); }to   { opacity: 1; transform: translateY(0); }}
    </style>
