<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>fosternya.xyz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
}

body {
    font-family: "Cinzel", Georgia, serif;
    -webkit-font-smoothing: antialiased;
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

#welcome {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    cursor: pointer;

    opacity: 1;
    visibility: visible;

    transition:
        opacity .9s ease,
        visibility .9s ease;
}

#welcome.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.welcome-content {
    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    user-select: none;
}


/* =========================================================
   WELCOME TITLE
========================================================= */

.welcome-title {
    position: relative;

    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size:
        clamp(3.7rem, 10vw, 9rem);

    line-height: .9;

    color: #f5f5f5;

    white-space: nowrap;

    text-shadow:
        0 0 2px rgba(255,255,255,.07);
}


/*
    SHINE:
    RIGHT → LEFT

    No giant glow.
*/

.welcome-title::after {
    content: "fosternya.xyz";

    position: absolute;
    inset: 0;

    font: inherit;

    color: transparent;

    background:
        linear-gradient(
            105deg,
            transparent 0%,
            transparent 38%,
            rgba(255,255,255,0) 44%,
            rgba(255,255,255,.95) 50%,
            rgba(255,255,255,0) 56%,
            transparent 62%,
            transparent 100%
        );

    background-size: 260% 100%;

    background-position: 250% 0;

    -webkit-background-clip: text;
    background-clip: text;

    animation:
        titleShine 4.2s
        cubic-bezier(.55,.05,.35,.95)
        infinite;

    pointer-events: none;
}

@keyframes titleShine {

    0% {
        background-position: 250% 0;
    }

    52%,
    100% {
        background-position: -150% 0;
    }
}


.enter-text {
    margin-top: 27px;

    font-family:
        "Cinzel",
        Georgia,
        serif;

    font-size:
        clamp(.62rem, 1.1vw, .95rem);

    letter-spacing: .40em;

    color:
        rgba(255,255,255,.45);

    transform: translateX(.2em);

    animation:
        enterPulse
        3s ease-in-out
        infinite;
}

@keyframes enterPulse {

    0%,
    100% {
        opacity: .30;
    }

    50% {
        opacity: .68;
    }
}


/* =========================================================
   MAIN SITE
========================================================= */

#site {
    position: fixed;
    inset: 0;

    background: #000;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#site.visible {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   LAYER 1 — AUDIO VISUALIZER
========================================================= */

#visualizer-layer {
    position: absolute;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    overflow: hidden;
}

#visualizer {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    display: block;
}


/* =========================================================
   LAYER 2 — CONTENT
========================================================= */

#content-layer {
    position: absolute;
    inset: 0;

    z-index: 5;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.content-wrap {

    width: min(760px, 84vw);

    text-align: center;

    transform:
        translateY(-7vh);
}


/* =========================================================
   MAIN TITLE
========================================================= */

.main-title {

    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size:
        clamp(4rem, 8.5vw, 8rem);

    line-height: .95;

    color: #fff;

    white-space: nowrap;

    text-shadow:
        0 0 3px rgba(255,255,255,.06);
}


/* =========================================================
   YOUR TEXT
========================================================= */

.custom-text-box {

    width: min(680px, 100%);

    margin:
        28px auto 0;

    padding:
        25px 30px;

    /*
        80% transparent.

        20% black remains.
    */

    background:
        rgba(0,0,0,.20);

    border:
        1px solid rgba(255,255,255,.055);

    /*
        NO GLOW.
    */

    box-shadow: none;

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);

    color:
        rgba(255,255,255,.74);

    font-size:
        clamp(.70rem, 1.15vw, .92rem);

    line-height: 1.9;

    letter-spacing: .055em;

    text-align: center;
}


/* =========================================================
   LAYER 3 — ORNAMENT
========================================================= */

#ornament-layer {

    position: absolute;
    inset: 0;

    z-index: 8;

    pointer-events: none;

    overflow: hidden;
}


/*
    This canvas contains the processed local image.

    Black pixels are removed in JavaScript.
*/

#ornamentCanvas {

    position: absolute;

    top: 0;
    right: 0;

    width:
        min(55vw, 900px);

    height: 100%;

    opacity: .90;

    filter:
        grayscale(1)
        contrast(1.15)
        brightness(1.05);

    transform-origin:
        right center;

    animation:
        ornamentFloat
        12s ease-in-out
        infinite;
}

@keyframes ornamentFloat {

    0%,
    100% {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    50% {
        transform:
            translate3d(-5px,0,0)
            scale(1.006);
    }
}


/* =========================================================
   VIGNETTE
========================================================= */

#vignette {

    position: absolute;
    inset: 0;

    z-index: 9;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.12) 72%,
            rgba(0,0,0,.45) 100%
        );
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    .welcome-title {
        font-size:
            clamp(3rem,14vw,5.5rem);
    }

    .enter-text {
        margin-top: 20px;
        font-size: .57rem;
        letter-spacing: .30em;
    }

    #visualizer {
        height: 50%;
    }

    .content-wrap {
        width: 88vw;
        transform:
            translateY(-5vh);
    }

    .main-title {
        font-size:
            clamp(3rem,14vw,5rem);

        white-space: normal;
    }

    .custom-text-box {
        margin-top: 20px;
        padding: 19px 17px;
        font-size: .67rem;
        line-height: 1.75;
    }

    #ornamentCanvas {
        width: 85vw;
        right: -22vw;
        opacity: .58;
    }
}


@media (max-width:420px) {

    .welcome-title {
        font-size: 3.05rem;
    }

    .main-title {
        font-size: 3.1rem;
    }

    .custom-text-box {
        width: 92vw;
        padding: 17px 14px;
    }

    #ornamentCanvas {
        width: 100vw;
        right: -35vw;
        opacity: .40;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     WELCOME
========================================================= -->

<section id="welcome">

    <div class="welcome-content">

        <div class="welcome-title">
            fosternya.xyz
        </div>

        <div class="enter-text">
            click to enter
        </div>

    </div>

</section>



<!-- =========================================================
     MAIN SITE
========================================================= -->

<main id="site">


    <!-- =====================================================
         LAYER 1
    ====================================================== -->

    <section id="visualizer-layer">

        <canvas id="visualizer"></canvas>

    </section>



    <!-- =====================================================
         LAYER 2
    ====================================================== -->

    <section id="content-layer">

        <div class="content-wrap">

            <h1 class="main-title">
                Foster, nya~!
            </h1>


            <!--
                ===============================================
                YOUR TEXT GOES HERE
                ===============================================
            -->

            <div class="custom-text-box">

                <div class="custom-text">

                    PUT YOUR TEXT HERE

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================================
         LAYER 3
    ====================================================== -->

    <section id="ornament-layer">

        <canvas id="ornamentCanvas"></canvas>

    </section>



    <div id="vignette"></div>

</main>



<!-- =========================================================
     AUDIO
========================================================= -->

<audio
    id="music"
    preload="auto"
    playsinline>
</audio>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const welcome =
    document.getElementById("welcome");

const site =
    document.getElementById("site");

const audio =
    document.getElementById("music");

const visualizer =
    document.getElementById("visualizer");

const vctx =
    visualizer.getContext("2d");

const ornamentCanvas =
    document.getElementById(
        "ornamentCanvas"
    );

const ornamentCtx =
    ornamentCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );



/* =========================================================
   TRACKS
========================================================= */

const tracks = [
    {
        file: "track1.mp3",
        weight: 0.70
    },
    {
        file: "track2.mp3",
        weight: 0.30
    }
];


function chooseTrack() {

    const random =
        Math.random();

    return (
        random <
        tracks[0].weight
    )
        ? tracks[0].file
        : tracks[1].file;
}



/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let analyser = null;

let source = null;

let frequencyData = null;

let audioStarted = false;



function setupAudio() {

    if (audioContext) {
        return;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        console.warn(
            "Web Audio API is not supported."
        );

        return;
    }


    audioContext =
        new AudioContext();


    analyser =
        audioContext.createAnalyser();


    analyser.fftSize =
        1024;


    analyser.smoothingTimeConstant =
        0.76;


    analyser.minDecibels =
        -90;


    analyser.maxDecibels =
        -15;


    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    source =
        audioContext
            .createMediaElementSource(
                audio
            );


    source.connect(
        analyser
    );


    analyser.connect(
        audioContext.destination
    );
}



/* =========================================================
   START MUSIC
========================================================= */

async function startMusic() {

    if (!audioStarted) {

        /*
            70 / 30 selection happens
            only once.
        */

        audio.src =
            chooseTrack();

        audio.volume =
            0.72;

        setupAudio();

        audioStarted =
            true;
    }


    /*
        Resume suspended AudioContext.
    */

    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        try {

            await audioContext.resume();

        } catch (error) {

            console.warn(
                "AudioContext resume failed:",
                error
            );
        }
    }


    /*
        Play the actual MP3.

        This call happens from the welcome
        click event.
    */

    try {

        await audio.play();

    } catch (error) {

        console.warn(
            "Audio playback failed:",
            error
        );

        /*
            The website STILL opens even if
            the browser refuses audio.
        */
    }
}



/* =========================================================
   ENTER SITE
========================================================= */

let entered = false;


function enterSite() {

    if (entered) {
        return;
    }


    entered = true;


    /*
        OPEN THE WEBSITE IMMEDIATELY.

        We do NOT wait for audio.play()
        before showing the site.
    */

    site.classList.add(
        "visible"
    );


    welcome.classList.add(
        "hidden"
    );


    /*
        Start audio after the visual state
        has been changed.

        Still inside the original click event.
    */

    startMusic();


    /*
        Start rendering immediately.
    */

    resizeVisualizer();

    requestAnimationFrame(
        drawVisualizer
    );
}


/*
    CLICK ANYWHERE ON THE WELCOME SCREEN.

    This is intentionally not limited to
    the small text.
*/

welcome.addEventListener(
    "click",
    enterSite
);


/*
    Also support keyboard activation.
*/

welcome.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            enterSite();
        }
    }
);



/* =========================================================
   VISUALIZER RESIZE
========================================================= */

let visualizerRatio =
    1;


function resizeVisualizer() {

    const rect =
        visualizer.getBoundingClientRect();


    visualizerRatio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    visualizer.width =
        Math.max(
            1,
            Math.floor(
                rect.width *
                visualizerRatio
            )
        );


    visualizer.height =
        Math.max(
            1,
            Math.floor(
                rect.height *
                visualizerRatio
            )
        );


    vctx.setTransform(
        visualizerRatio,
        0,
        0,
        visualizerRatio,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeVisualizer,
    {
        passive: true
    }
);



/* =========================================================
   VISUALIZER
========================================================= */

let visualizerTime =
    0;


function drawVisualizer(time) {

    visualizerTime =
        time * 0.001;


    const width =
        visualizer.clientWidth;


    const height =
        visualizer.clientHeight;


    vctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        analyser &&
        frequencyData
    ) {

        /*
            THIS IS THE IMPORTANT PART:

            frequencyData is coming directly
            from the currently selected MP3.

            Therefore BOTH track1.mp3 and
            track2.mp3 genuinely control
            the bars.
        */

        analyser.getByteFrequencyData(
            frequencyData
        );


        drawAudioBars(
            width,
            height
        );

    } else {

        drawIdleBars(
            width,
            height
        );
    }


    requestAnimationFrame(
        drawVisualizer
    );
}



/* =========================================================
   IDLE BARS
========================================================= */

function drawIdleBars(
    width,
    height
) {

    const barCount =
        Math.max(
            35,
            Math.floor(
                width / 15
            )
        );


    const gap =
        width / barCount;


    for (
        let i = 0;
        i < barCount;
        i++
    ) {

        const wave =
            Math.sin(
                visualizerTime * 1.2 +
                i * .31
            );


        const barHeight =
            height *
            (
                .07 +
                Math.abs(wave) * .10
            );


        drawBar(
            i * gap,
            height - barHeight,
            Math.max(
                4,
                gap * .54
            ),
            barHeight,
            .10,
            i
        );
    }
}



/* =========================================================
   AUDIO BARS
========================================================= */

function drawAudioBars(
    width,
    height
) {

    /*
        BIGGER BARS.

        FEWER BARS.
    */

    const barCount =
        Math.max(
            38,
            Math.min(
                96,
                Math.floor(
                    width / 11
                )
            )
        );


    const gap =
        width / barCount;


    const binCount =
        frequencyData.length;


    for (
        let i = 0;
        i < barCount;
        i++
    ) {

        const normalized =
            i / barCount;


        /*
            Frequency distribution.
        */

        const bin =
            Math.floor(
                Math.pow(
                    normalized,
                    1.65
                ) *
                (binCount - 1)
            );


        const raw =
            frequencyData[bin] /
            255;


        /*
            Small movement.
        */

        const movement =
            Math.sin(
                visualizerTime * 7 +
                i * .57
            ) * .018;


        const energy =
            Math.max(
                0,
                Math.min(
                    1,
                    raw + movement
                )
            );


        /*
            Reduced by approximately 20%.
        */

        const barHeight =
            Math.max(
                3,
                height *
                (
                    .018 +
                    energy * .73
                )
            );


        const alpha =
            .075 +
            energy * .25;


        drawBar(
            i * gap,
            height - barHeight,
            Math.max(
                4,
                gap * .54
            ),
            barHeight,
            alpha,
            i
        );
    }
}



/* =========================================================
   CORRUPTED BAR
========================================================= */

function drawBar(
    x,
    y,
    width,
    height,
    alpha,
    index
) {

    vctx.save();


    /*
        Main transparent white bar.
    */

    vctx.fillStyle =
        `rgba(
            255,
            255,
            255,
            ${alpha}
        )`;


    vctx.fillRect(
        x,
        y,
        width,
        height
    );


    /*
        FEWER, LARGER SEGMENTS.
    */

    const segmentCount =
        Math.max(
            2,
            Math.min(
                4,
                Math.floor(
                    height / 65
                )
            )
        );


    for (
        let s = 0;
        s < segmentCount;
        s++
    ) {

        const seed =
            Math.sin(
                index * 91.73 +
                s * 17.31
            ) *
            43758.5453;


        const random =
            seed -
            Math.floor(seed);


        const segmentHeight =
            Math.max(
                3,
                height *
                (
                    .035 +
                    random * .055
                )
            );


        const segmentY =
            y +
            random *
            Math.max(
                1,
                height -
                segmentHeight
            );


        const shift =
            random > .63
                ? (random - .5) * 20
                : 0;


        const segmentWidth =
            width *
            (
                .55 +
                random * .9
            );


        vctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${Math.min(
                    .34,
                    alpha * 1.8
                )}
            )`;


        vctx.fillRect(
            x + shift,
            segmentY,
            segmentWidth,
            segmentHeight
        );
    }


    /*
        Occasional horizontal corruption.
    */

    const glitchSeed =
        Math.sin(
            index * 42.17 +
            Math.floor(
                visualizerTime * 6
            )
        ) *
        43758.5453;


    const glitchRandom =
        glitchSeed -
        Math.floor(
            glitchSeed
        );


    if (
        glitchRandom > .78
    ) {

        const glitchY =
            y +
            glitchRandom *
            height;


        vctx.fillStyle =
            "rgba(255,255,255,.20)";


        vctx.fillRect(
            x - width,
            glitchY,
            width * 3,
            1
        );
    }


    vctx.restore();
}



/* =========================================================
   ORNAMENT — LOCAL FILE
========================================================= */

const ornamentURL =
    "ornament.jpg";


function processOrnament() {

    const image =
        new Image();


    image.onload =
        function () {

            const rect =
                ornamentCanvas
                    .getBoundingClientRect();


            const cssWidth =
                rect.width;


            const cssHeight =
                rect.height;


            const ratio =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            ornamentCanvas.width =
                Math.floor(
                    cssWidth * ratio
                );


            ornamentCanvas.height =
                Math.floor(
                    cssHeight * ratio
                );


            ornamentCtx.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );


            /*
                Temporary canvas.
            */

            const temp =
                document.createElement(
                    "canvas"
                );


            temp.width =
                image.naturalWidth;


            temp.height =
                image.naturalHeight;


            const tempCtx =
                temp.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );


            tempCtx.drawImage(
                image,
                0,
                0
            );


            const imageData =
                tempCtx.getImageData(
                    0,
                    0,
                    temp.width,
                    temp.height
                );


            const pixels =
                imageData.data;


            /*
                REMOVE BLACK COMPLETELY.

                Dark pixels become transparent.
            */

            for (
                let i = 0;
                i < pixels.length;
                i += 4
            ) {

                const r =
                    pixels[i];

                const g =
                    pixels[i + 1];

                const b =
                    pixels[i + 2];


                const brightness =
                    (
                        r +
                        g +
                        b
                    ) / 3;


                if (
                    brightness < 35
                ) {

                    /*
                        FULLY TRANSPARENT.
                    */

                    pixels[i + 3] =
                        0;

                } else if (
                    brightness < 100
                ) {

                    /*
                        Smooth transition
                        for anti-aliased edges.
                    */

                    pixels[i + 3] =
                        Math.floor(
                            (
                                brightness -
                                35
                            ) *
                            2.2
                        );

                } else {

                    pixels[i + 3] =
                        255;
                }


                /*
                    Clean grayscale.
                */

                pixels[i] =
                    brightness;

                pixels[i + 1] =
                    brightness;

                pixels[i + 2] =
                    brightness;
            }


            tempCtx.putImageData(
                imageData,
                0,
                0
            );


            ornamentCtx.clearRect(
                0,
                0,
                cssWidth,
                cssHeight
            );


            ornamentCtx.drawImage(
                temp,
                0,
                0,
                cssWidth,
                cssHeight
            );
        };


    image.onerror =
        function () {

            console.error(
                "Could not load ornament.jpg. " +
                "Make sure it is in the same folder as index.html."
            );
        };


    image.src =
        ornamentURL;
}



/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    () => {

        resizeVisualizer();

        processOrnament();

    }
);


/* =========================================================
   RESIZE ORNAMENT
========================================================= */

window.addEventListener(
    "resize",
    () => {

        processOrnament();

    },
    {
        passive: true
    }
);


/* =========================================================
   MOBILE AUDIO RESUME
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            !document.hidden &&
            audioContext &&
            audioContext.state ===
            "suspended"
        ) {

            try {

                await audioContext.resume();

            } catch (_) {}

        }
    }
);

</script>

</body>
</html>
