<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<title>fosternya.xyz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: #fff;
}

body {
    font-family: "Cinzel", Georgia, serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;

    overscroll-behavior: none;
    touch-action: manipulation;
}


/* =========================================================
   WELCOME
========================================================= */

#welcome {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    z-index: 10000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    cursor: pointer;
    user-select: none;

    opacity: 1;
    visibility: visible;

    transition:
        opacity .8s cubic-bezier(.77,0,.18,1),
        visibility .8s;
}

#welcome.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.welcome-content {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}


/* =========================================================
   WELCOME TITLE
   RIGHT → LEFT SHINE
========================================================= */

.welcome-title {
    position: relative;

    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size: clamp(3.2rem, 10vw, 9rem);

    line-height: .9;

    color: #fff;

    letter-spacing: .015em;

    white-space: nowrap;

    text-shadow:
        0 0 2px rgba(255,255,255,.05);
}

.welcome-title::after {
    content: "fosternya.xyz";

    position: absolute;
    inset: 0;

    font: inherit;

    color: transparent;

    background:
        linear-gradient(
            105deg,
            transparent 40%,
            rgba(255,255,255,.9) 50%,
            transparent 60%
        );

    background-size: 260% 100%;
    background-position: 250% 0;

    -webkit-background-clip: text;
    background-clip: text;

    animation:
        welcomeShine
        4.5s
        cubic-bezier(.55,.05,.35,.95)
        infinite;

    pointer-events: none;
}

@keyframes welcomeShine {

    0% {
        background-position: 250% 0;
    }

    52%,
    100% {
        background-position: -150% 0;
    }
}


/* =========================================================
   ENTER
========================================================= */

.enter-text {
    margin-top: 22px;

    font-size: clamp(.55rem, 1.1vw, .9rem);

    letter-spacing: .4em;

    color: rgba(255,255,255,.42);

    transform: translateX(.2em);

    animation:
        enterPulse
        3s
        ease-in-out
        infinite;
}

@keyframes enterPulse {

    0%,
    100% {
        opacity: .25;
    }

    50% {
        opacity: .65;
    }
}


/* =========================================================
   MAIN SITE
========================================================= */

#site {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;

    background: #000;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .9s cubic-bezier(.77,0,.18,1),
        visibility .9s;
}

#site.visible {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   VISUALIZER
========================================================= */

#visualizer-layer {
    position: absolute;
    inset: 0;

    z-index: 1;

    pointer-events: none;
}

#visualizer {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    display: block;

    pointer-events: none;
}


/*
   PURE WHITE SHINE OVERLAY

   The visualizer itself stays white.
   This creates a subtle right → left
   light sweep without making the bars glow.
*/

#visualizer-layer::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            110deg,
            transparent 0%,
            transparent 38%,
            rgba(255,255,255,.10) 48%,
            rgba(255,255,255,.28) 50%,
            rgba(255,255,255,.10) 52%,
            transparent 62%,
            transparent 100%
        );

    background-size: 250% 100%;

    animation:
        visualizerShine
        5s
        cubic-bezier(.55,.05,.35,.95)
        infinite;

    mix-blend-mode: screen;
}

@keyframes visualizerShine {

    0% {
        background-position: 250% 0;
    }

    100% {
        background-position: -150% 0;
    }
}


/* =========================================================
   MAIN CONTENT
========================================================= */

#content-layer {
    position: absolute;
    inset: 0;

    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.content-wrap {
    width: min(760px, 86vw);

    text-align: center;

    transform: translateY(-7vh);
}


/* =========================================================
   MAIN TITLE
========================================================= */

.main-title {
    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size:
        clamp(
            3.5rem,
            8.5vw,
            8rem
        );

    line-height: .92;

    color: #fff;

    letter-spacing: .01em;

    white-space: nowrap;
}


/* =========================================================
   TEXT BOX
========================================================= */

.custom-text-box {
    width: min(680px, 100%);

    margin:
        clamp(18px, 3vh, 28px)
        auto 0;

    padding:
        clamp(16px, 2vw, 25px)
        clamp(17px, 3vw, 30px);

    background:
        rgba(0,0,0,.20);

    border:
        1px solid
        rgba(255,255,255,.045);

    box-shadow: none;

    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);

    color:
        rgba(255,255,255,.72);

    font-size:
        clamp(.65rem,1.05vw,.9rem);

    line-height: 1.85;

    letter-spacing: .045em;
}


/* =========================================================
   ORNAMENT
========================================================= */

#ornament-layer {
    position: absolute;
    inset: 0;

    z-index: 8;

    pointer-events: none;

    overflow: hidden;
}


/*
   CSS IMAGE

   No canvas.
   No pixel manipulation.
   No grayscale.

   SCREEN makes black disappear against
   the pure black site background.
*/

#ornament {
    position: absolute;

    top: 0;
    right: 0;

    width:
        min(
            58vw,
            900px
        );

    height: 100%;

    object-fit: contain;
    object-position: right center;

    opacity: .95;

    mix-blend-mode: screen;

    filter:
        grayscale(1)
        brightness(1.05)
        contrast(1.08);

    transform-origin: right center;

    animation:
        ornamentFloat
        12s
        ease-in-out
        infinite;

    will-change: transform;

    user-select: none;
    -webkit-user-drag: none;
}

@keyframes ornamentFloat {

    0%,
    100% {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    50% {
        transform:
            translate3d(-5px,0,0)
            scale(1.004);
    }
}


/* =========================================================
   VIGNETTE
========================================================= */

#vignette {
    position: absolute;
    inset: 0;

    z-index: 9;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 43%,
            rgba(0,0,0,.08) 73%,
            rgba(0,0,0,.40) 100%
        );
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .main-title {
        font-size:
            clamp(
                3.3rem,
                10vw,
                6.5rem
            );
    }

    #ornament {
        width: 65vw;
    }
}


/* =========================================================
   PHONE
========================================================= */

@media (max-width: 700px) {

    .welcome-title {
        font-size:
            clamp(
                2.8rem,
                14vw,
                5.5rem
            );
    }

    .enter-text {
        margin-top: 19px;
        font-size: .56rem;
        letter-spacing: .29em;
    }

    .content-wrap {
        width: 88vw;
        transform: translateY(-5vh);
    }

    .main-title {
        font-size:
            clamp(
                2.9rem,
                14vw,
                5rem
            );

        white-space: normal;
    }

    .custom-text-box {
        margin-top: 19px;

        padding:
            17px 16px;

        font-size: .66rem;

        line-height: 1.75;
    }

    #ornament {
        width: 90vw;

        right: -24vw;

        opacity: .55;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 430px) {

    .welcome-title {
        font-size: 3rem;
    }

    .main-title {
        font-size: 3.15rem;
    }

    .custom-text-box {
        width: 92vw;
        padding: 16px 13px;
    }

    #ornament {
        width: 105vw;
        right: -38vw;
        opacity: .42;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media
(max-height: 500px)
and
(orientation: landscape) {

    .welcome-title {
        font-size:
            clamp(
                2.7rem,
                10vh,
                5rem
            );
    }

    .enter-text {
        margin-top: 12px;
    }

    .content-wrap {
        transform: translateY(-3vh);
    }

    .main-title {
        font-size:
            clamp(
                2.8rem,
                13vh,
                5rem
            );
    }

    .custom-text-box {
        margin-top: 13px;
        padding: 10px 18px;
        line-height: 1.5;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     WELCOME
======================================================= -->

<section id="welcome">

    <div class="welcome-content">

        <div class="welcome-title">
            fosternya.xyz
        </div>

        <div class="enter-text">
            click to enter
        </div>

    </div>

</section>



<!-- =======================================================
     MAIN
======================================================= -->

<main id="site">


    <!-- VISUALIZER -->

    <section id="visualizer-layer">

        <canvas id="visualizer"></canvas>

    </section>



    <!-- TEXT -->

    <section id="content-layer">

        <div class="content-wrap">

            <h1 class="main-title">
                Foster, nya~!
            </h1>

            <div class="custom-text-box">
                PUT YOUR TEXT HERE
            </div>

        </div>

    </section>



    <!-- ===================================================
         CSS IMAGE
    ==================================================== -->

    <section id="ornament-layer">

        <img
            id="ornament"
            src="ornament.jpg"
            alt=""
            draggable="false"
        >

    </section>


    <div id="vignette"></div>

</main>



<!-- =======================================================
     AUDIO
======================================================= -->

<audio
    id="music"
    preload="auto"
    playsinline>
</audio>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const welcome =
    document.getElementById("welcome");

const site =
    document.getElementById("site");

const audio =
    document.getElementById("music");

const visualizer =
    document.getElementById("visualizer");

const ctx =
    visualizer.getContext("2d");


/* =========================================================
   TRACKS
========================================================= */

const tracks = [
    {
        file: "track1.mp3",
        weight: .70
    },
    {
        file: "track2.mp3",
        weight: .30
    }
];


function chooseTrack() {

    return Math.random() < .70
        ? "track1.mp3"
        : "track2.mp3";
}


/* =========================================================
   AUDIO ANALYSER
========================================================= */

let audioContext = null;

let analyser = null;

let source = null;

let frequencyData = null;

let audioStarted = false;


function setupAudio() {

    if (audioContext) {
        return;
    }

    const AC =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AC) {
        return;
    }

    audioContext =
        new AC();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize =
        1024;

    analyser.smoothingTimeConstant =
        .72;

    analyser.minDecibels =
        -90;

    analyser.maxDecibels =
        -15;

    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    source =
        audioContext.createMediaElementSource(
            audio
        );

    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );
}


/* =========================================================
   AUDIO FADE IN — 0.5 SEC
========================================================= */

function fadeIn() {

    const start =
        performance.now();

    const duration =
        500;


    function animateVolume(now) {

        const progress =
            Math.min(
                1,
                (now - start) /
                duration
            );

        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );

        audio.volume =
            .72 * eased;


        if (progress < 1) {

            requestAnimationFrame(
                animateVolume
            );

        } else {

            audio.volume =
                .72;
        }
    }


    requestAnimationFrame(
        animateVolume
    );
}


/* =========================================================
   START MUSIC
========================================================= */

async function startMusic() {

    if (!audioStarted) {

        audio.src =
            chooseTrack();

        setupAudio();

        audioStarted =
            true;
    }


    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        try {
            await audioContext.resume();
        } catch (_) {}
    }


    try {

        audio.volume = 0;

        await audio.play();

        fadeIn();

    } catch (error) {

        console.warn(
            "Audio playback failed:",
            error
        );
    }
}


/* =========================================================
   ENTER
========================================================= */

let entered = false;


function enterSite() {

    if (entered) {
        return;
    }

    entered = true;

    site.classList.add(
        "visible"
    );

    welcome.classList.add(
        "hidden"
    );

    startMusic();

    resizeCanvas();

    requestAnimationFrame(
        visualizerLoop
    );
}


welcome.addEventListener(
    "click",
    enterSite
);


/* =========================================================
   CANVAS RESIZE
========================================================= */

let dpr = 1;


function resizeCanvas() {

    const rect =
        visualizer.getBoundingClientRect();


    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    visualizer.width =
        Math.max(
            1,
            Math.floor(
                rect.width * dpr
            )
        );


    visualizer.height =
        Math.max(
            1,
            Math.floor(
                rect.height * dpr
            )
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* =========================================================
   VISUALIZER
========================================================= */

let time = 0;


function visualizerLoop(timestamp) {

    time =
        timestamp / 1000;


    const width =
        visualizer.clientWidth;

    const height =
        visualizer.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        analyser &&
        frequencyData
    ) {

        analyser.getByteFrequencyData(
            frequencyData
        );

        drawVisualizer(
            width,
            height
        );

    } else {

        drawIdle(
            width,
            height
        );
    }


    requestAnimationFrame(
        visualizerLoop
    );
}


/* =========================================================
   AUDIO VISUALIZER
========================================================= */

function drawVisualizer(
    width,
    height
) {

    /*
        Fewer / larger columns.
    */

    const columns =
        Math.max(
            25,
            Math.min(
                65,
                Math.floor(
                    width / 28
                )
            )
        );


    const columnWidth =
        width / columns;


    const bins =
        frequencyData.length;


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        const position =
            i / columns;


        const bin =
            Math.floor(
                Math.pow(
                    position,
                    1.5
                ) *
                (bins - 1)
            );


        const audioLevel =
            frequencyData[bin] / 255;


        const pulse =
            Math.sin(
                time * 4 +
                i * .71
            ) * .025;


        const energy =
            Math.max(
                0,
                Math.min(
                    1,
                    audioLevel +
                    pulse
                )
            );


        drawFragments(
            i,
            i * columnWidth,
            columnWidth,
            height,
            energy
        );
    }
}


/* =========================================================
   CORRUPTED FRAGMENTS
========================================================= */

function drawFragments(
    index,
    x,
    columnWidth,
    height,
    energy
) {

    const totalHeight =
        Math.max(
            12,
            height *
            (
                .04 +
                energy *
                .84
            )
        );


    const top =
        height -
        totalHeight;


    /*
        Only a few fragments.
    */

    const fragments =
        3 +
        Math.floor(
            energy * 4
        );


    for (
        let f = 0;
        f < fragments;
        f++
    ) {

        /*
            Deterministic random.
        */

        const seed =
            Math.sin(
                index * 71.37 +
                f * 31.19
            ) *
            43758.5453;


        const random =
            seed -
            Math.floor(seed);


        const y =
            top +
            random *
            totalHeight;


        const length =
            columnWidth *
            (
                .25 +
                random *
                1.7
            );


        const offset =
            (
                random -
                .5
            ) *
            columnWidth *
            (
                .8 +
                energy * 2.5
            );


        const thickness =
            random > .85
                ? 2
                : 1;


        /*
            PURE WHITE.

            Alpha controls transparency.
            There is no grey color.
        */

        const alpha =
            .15 +
            energy * .55;


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${alpha}
            )`;


        /*
            Main fragment.
        */

        ctx.fillRect(
            x + offset,
            y,
            length,
            thickness
        );


        /*
            Detached corruption.
        */

        if (random > .52) {

            const detached =
                length *
                (
                    .15 +
                    random * .35
                );


            ctx.fillRect(
                x +
                offset +
                length +
                columnWidth * .10,

                y +
                thickness +
                1,

                detached,

                1
            );
        }
    }


    /*
        Occasional horizontal
        corrupted slash.
    */

    const glitchSeed =
        Math.sin(
            index * 93.17 +
            Math.floor(time * 8)
        ) *
        43758.5453;


    const glitchRandom =
        glitchSeed -
        Math.floor(glitchSeed);


    if (
        glitchRandom > .88 &&
        energy > .20
    ) {

        const y =
            top +
            glitchRandom *
            totalHeight;


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${.22 + energy * .38}
            )`;


        ctx.fillRect(
            x - columnWidth,
            y,
            columnWidth *
            (
                1 +
                energy * 2.4
            ),
            1
        );
    }
}


/* =========================================================
   IDLE ANIMATION
========================================================= */

function drawIdle(
    width,
    height
) {

    const columns =
        Math.max(
            25,
            Math.floor(
                width / 28
            )
        );


    const columnWidth =
        width / columns;


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        const movement =
            (
                Math.sin(
                    time * 1.3 +
                    i * .53
                ) + 1
            ) / 2;


        const energy =
            .06 +
            movement * .10;


        drawFragments(
            i,
            i * columnWidth,
            columnWidth,
            height,
            energy
        );
    }
}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    () => {

        resizeCanvas();

    }
);


/* =========================================================
   AUDIO RECOVERY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                audioContext &&
                audioContext.state ===
                "suspended"
            ) {

                try {
                    await audioContext.resume();
                } catch (_) {}
            }
        }
    }
);

</script>

</body>
</html>
