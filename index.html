<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<title>fosternya.xyz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
    color: #fff;
}

body {
    font-family:
        "Cinzel",
        Georgia,
        serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;

    overscroll-behavior: none;
    touch-action: manipulation;
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

#welcome {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    z-index: 10000;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    cursor: pointer;
    user-select: none;

    opacity: 1;
    visibility: visible;

    transition:
        opacity .8s cubic-bezier(.77,0,.18,1),
        visibility .8s;
}

#welcome.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


.welcome-content {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}


/* =========================================================
   WELCOME TITLE
========================================================= */

.welcome-title {

    position: relative;

    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size:
        clamp(
            3.2rem,
            10vw,
            9rem
        );

    line-height: .9;

    letter-spacing: .015em;

    color: #f5f5f5;

    white-space: nowrap;

    text-shadow:
        0 0 2px rgba(255,255,255,.06);
}


/*
    RIGHT → LEFT SHINE
*/

.welcome-title::after {

    content: "fosternya.xyz";

    position: absolute;

    inset: 0;

    font: inherit;

    letter-spacing: inherit;

    color: transparent;

    background:
        linear-gradient(
            105deg,

            transparent 0%,
            transparent 39%,

            rgba(255,255,255,0) 45%,

            rgba(255,255,255,.95) 50%,

            rgba(255,255,255,0) 55%,

            transparent 61%,
            transparent 100%
        );

    background-size:
        260% 100%;

    background-position:
        250% 0;

    -webkit-background-clip: text;
    background-clip: text;

    animation:
        titleShine
        4.5s
        cubic-bezier(.55,.05,.35,.95)
        infinite;

    pointer-events: none;
}

@keyframes titleShine {

    0% {
        background-position: 250% 0;
    }

    52%,
    100% {
        background-position: -150% 0;
    }
}


/* =========================================================
   CLICK TO ENTER
========================================================= */

.enter-text {

    margin-top:
        clamp(
            18px,
            3vh,
            30px
        );

    font-family:
        "Cinzel",
        Georgia,
        serif;

    font-size:
        clamp(
            .55rem,
            1.1vw,
            .9rem
        );

    font-weight: 500;

    letter-spacing:
        clamp(
            .24em,
            .4em,
            .45em
        );

    color:
        rgba(
            255,
            255,
            255,
            .42
        );

    transform:
        translateX(.2em);

    animation:
        enterPulse
        3s
        ease-in-out
        infinite;
}

@keyframes enterPulse {

    0%,
    100% {
        opacity: .28;
    }

    50% {
        opacity: .68;
    }
}


/* =========================================================
   MAIN SITE
========================================================= */

#site {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;

    background: #000;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .9s cubic-bezier(.77,0,.18,1),
        visibility .9s;
}

#site.visible {

    opacity: 1;
    visibility: visible;
}


/* =========================================================
   LAYER 1 — VISUALIZER
========================================================= */

#visualizer-layer {

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    overflow: hidden;
}


#visualizer {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 50%;

    display: block;

    pointer-events: none;
}


/* =========================================================
   LAYER 2 — CONTENT
========================================================= */

#content-layer {

    position: absolute;

    inset: 0;

    z-index: 5;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


.content-wrap {

    width:
        min(
            760px,
            86vw
        );

    text-align: center;

    transform:
        translateY(-7vh);
}


/* =========================================================
   MAIN TITLE
========================================================= */

.main-title {

    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size:
        clamp(
            3.5rem,
            8.5vw,
            8rem
        );

    line-height: .92;

    color: #fff;

    letter-spacing: .01em;

    white-space: nowrap;

    text-shadow:
        0 0 2px rgba(255,255,255,.05);
}


/* =========================================================
   CUSTOM TEXT BOX
========================================================= */

.custom-text-box {

    width:
        min(
            680px,
            100%
        );

    margin:
        clamp(
            18px,
            3vh,
            28px
        )
        auto 0;

    padding:
        clamp(
            16px,
            2vw,
            25px
        )
        clamp(
            17px,
            3vw,
            30px
        );

    /*
        80% TRANSPARENT
    */

    background:
        rgba(
            0,
            0,
            0,
            .20
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .045
        );

    box-shadow: none;

    /*
        Very small blur only.
    */

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);

    color:
        rgba(
            255,
            255,
            255,
            .72
        );

    font-size:
        clamp(
            .65rem,
            1.05vw,
            .9rem
        );

    line-height: 1.85;

    letter-spacing: .045em;

    text-align: center;
}


/* =========================================================
   LAYER 3 — ORNAMENT
========================================================= */

#ornament-layer {

    position: absolute;

    inset: 0;

    z-index: 8;

    pointer-events: none;

    overflow: hidden;
}


#ornamentCanvas {

    position: absolute;

    top: 0;
    right: 0;

    width:
        min(
            56vw,
            900px
        );

    height: 100%;

    opacity: .90;

    /*
        IMPORTANT:
        No grayscale.
        No black background.
        No glow.
        The JS removes the black pixels.
    */

    filter: none;

    transform-origin:
        right center;

    animation:
        ornamentFloat
        12s
        ease-in-out
        infinite;

    will-change: transform;

    pointer-events: none;
}

@keyframes ornamentFloat {

    0%,
    100% {
        transform:
            translate3d(
                0,
                0,
                0
            )
            scale(1);
    }

    50% {
        transform:
            translate3d(
                -4px,
                0,
                0
            )
            scale(1.004);
    }
}


/* =========================================================
   VIGNETTE
========================================================= */

#vignette {

    position: absolute;

    inset: 0;

    z-index: 9;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,

            transparent 43%,

            rgba(0,0,0,.10) 73%,

            rgba(0,0,0,.42) 100%
        );
}


/* =========================================================
   TABLET / SMALL DESKTOP
========================================================= */

@media (max-width: 900px) {

    .main-title {

        font-size:
            clamp(
                3.3rem,
                10vw,
                6.5rem
            );
    }

    #ornamentCanvas {

        width:
            65vw;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .welcome-title {

        font-size:
            clamp(
                2.8rem,
                14vw,
                5.5rem
            );
    }


    .enter-text {

        margin-top: 19px;

        font-size: .56rem;

        letter-spacing: .29em;
    }


    #visualizer {

        height: 50%;
    }


    .content-wrap {

        width: 88vw;

        transform:
            translateY(-5vh);
    }


    .main-title {

        font-size:
            clamp(
                2.9rem,
                14vw,
                5rem
            );

        white-space: normal;
    }


    .custom-text-box {

        margin-top: 19px;

        padding:
            17px 16px;

        font-size: .66rem;

        line-height: 1.75;
    }


    #ornamentCanvas {

        width: 86vw;

        right: -22vw;

        opacity: .56;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 430px) {

    .welcome-title {

        font-size: 3rem;
    }


    .main-title {

        font-size: 3.15rem;
    }


    .custom-text-box {

        width: 92vw;

        padding:
            16px 13px;
    }


    #ornamentCanvas {

        width: 102vw;

        right: -36vw;

        opacity: .38;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media
(max-height: 500px)
and
(orientation: landscape) {

    .welcome-title {

        font-size:
            clamp(
                2.7rem,
                10vh,
                5rem
            );
    }


    .enter-text {

        margin-top: 12px;
    }


    .content-wrap {

        transform:
            translateY(-3vh);
    }


    .main-title {

        font-size:
            clamp(
                2.8rem,
                13vh,
                5rem
            );
    }


    .custom-text-box {

        margin-top: 13px;

        padding:
            10px 18px;

        line-height: 1.5;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     WELCOME
======================================================= -->

<section id="welcome">

    <div class="welcome-content">

        <div class="welcome-title">
            fosternya.xyz
        </div>

        <div class="enter-text">
            click to enter
        </div>

    </div>

</section>



<!-- =======================================================
     MAIN SITE
======================================================= -->

<main id="site">


    <!-- ===================================================
         LAYER 1
    ==================================================== -->

    <section id="visualizer-layer">

        <canvas id="visualizer"></canvas>

    </section>



    <!-- ===================================================
         LAYER 2
    ==================================================== -->

    <section id="content-layer">

        <div class="content-wrap">

            <h1 class="main-title">
                Foster, nya~!
            </h1>


            <!-- =========================================
                 PUT YOUR OWN TEXT HERE
            ========================================== -->

            <div class="custom-text-box">

                PUT YOUR TEXT HERE

            </div>

        </div>

    </section>



    <!-- ===================================================
         LAYER 3
    ==================================================== -->

    <section id="ornament-layer">

        <canvas
            id="ornamentCanvas">
        </canvas>

    </section>


    <div id="vignette"></div>

</main>



<!-- =======================================================
     AUDIO
======================================================= -->

<audio
    id="music"
    preload="auto"
    playsinline>
</audio>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const welcome =
    document.getElementById(
        "welcome"
    );

const site =
    document.getElementById(
        "site"
    );

const audio =
    document.getElementById(
        "music"
    );

const visualizer =
    document.getElementById(
        "visualizer"
    );

const vctx =
    visualizer.getContext(
        "2d"
    );

const ornamentCanvas =
    document.getElementById(
        "ornamentCanvas"
    );

const ornamentCtx =
    ornamentCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


/* =========================================================
   TRACKS — 70 / 30
========================================================= */

const tracks = [

    {
        file: "track1.mp3",
        weight: 0.70
    },

    {
        file: "track2.mp3",
        weight: 0.30
    }

];


function chooseTrack() {

    return Math.random() <
        tracks[0].weight

        ? tracks[0].file

        : tracks[1].file;
}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let analyser = null;

let source = null;

let frequencyData = null;

let audioStarted = false;


function setupAudio() {

    if (audioContext) {
        return;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {
        return;
    }


    audioContext =
        new AudioContext();


    analyser =
        audioContext.createAnalyser();


    /*
        1024 FFT.

        Enough detail for the visualizer
        without making mobile devices
        unnecessarily work.
    */

    analyser.fftSize =
        1024;


    analyser.smoothingTimeConstant =
        .72;


    analyser.minDecibels =
        -90;


    analyser.maxDecibels =
        -15;


    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    source =
        audioContext
            .createMediaElementSource(
                audio
            );


    source.connect(
        analyser
    );


    analyser.connect(
        audioContext.destination
    );
}


/* =========================================================
   0.5 SECOND AUDIO FADE
========================================================= */

function fadeInAudio() {

    const duration =
        500;

    const start =
        performance.now();


    function fade(now) {

        const progress =
            Math.min(
                1,
                (now - start) /
                duration
            );


        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        audio.volume =
            .72 * eased;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                fade
            );

        } else {

            audio.volume =
                .72;
        }
    }


    requestAnimationFrame(
        fade
    );
}


/* =========================================================
   START MUSIC
========================================================= */

async function startMusic() {

    if (!audioStarted) {

        audio.src =
            chooseTrack();

        setupAudio();

        audioStarted =
            true;
    }


    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        try {

            await audioContext.resume();

        } catch (_) {}
    }


    try {

        audio.volume =
            0;

        await audio.play();

        fadeInAudio();

    } catch (error) {

        console.warn(
            "Audio playback failed:",
            error
        );
    }
}


/* =========================================================
   ENTER SITE — ONE CLICK
========================================================= */

let entered = false;


function enterSite() {

    if (entered) {
        return;
    }


    entered = true;


    /*
        Main site opens immediately.
    */

    site.classList.add(
        "visible"
    );


    welcome.classList.add(
        "hidden"
    );


    /*
        Start music from the same
        user interaction.
    */

    startMusic();


    resizeVisualizer();


    requestAnimationFrame(
        drawVisualizer
    );
}


welcome.addEventListener(
    "click",
    enterSite
);


/* =========================================================
   KEYBOARD ENTER
========================================================= */

welcome.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            enterSite();
        }
    }
);


/* =========================================================
   VISUALIZER RESIZE
========================================================= */

let visualizerRatio = 1;


function resizeVisualizer() {

    const rect =
        visualizer
            .getBoundingClientRect();


    /*
        Cap DPR at 2.

        Prevents extreme mobile
        DPR from multiplying canvas
        rendering cost.
    */

    visualizerRatio =
        Math.min(
            window.devicePixelRatio ||
            1,
            2
        );


    visualizer.width =
        Math.max(
            1,
            Math.floor(
                rect.width *
                visualizerRatio
            )
        );


    visualizer.height =
        Math.max(
            1,
            Math.floor(
                rect.height *
                visualizerRatio
            )
        );


    vctx.setTransform(
        visualizerRatio,
        0,
        0,
        visualizerRatio,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeVisualizer,
    {
        passive: true
    }
);


/* =========================================================
   VISUALIZER LOOP
========================================================= */

let visualizerTime = 0;


function drawVisualizer(timestamp) {

    visualizerTime =
        timestamp *
        0.001;


    const width =
        visualizer.clientWidth;


    const height =
        visualizer.clientHeight;


    vctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        analyser &&
        frequencyData
    ) {

        analyser.getByteFrequencyData(
            frequencyData
        );


        drawCorruptedVisualizer(
            width,
            height
        );

    } else {

        drawIdleVisualizer(
            width,
            height
        );
    }


    /*
        requestAnimationFrame follows
        the actual display refresh rate.

        60Hz  → ~60 FPS
        120Hz → ~120 FPS
        144Hz → ~144 FPS
    */

    requestAnimationFrame(
        drawVisualizer
    );
}


/* =========================================================
   IDLE VISUALIZER
========================================================= */

function drawIdleVisualizer(
    width,
    height
) {

    const columns =
        Math.max(
            28,
            Math.floor(
                width / 25
            )
        );


    const columnWidth =
        width /
        columns;


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        const wave =
            (
                Math.sin(
                    visualizerTime *
                    1.3 +
                    i *
                    .53
                ) +
                1
            ) *
            .5;


        const energy =
            .08 +
            wave *
            .14;


        drawCorruptedColumn(
            i,
            i * columnWidth,
            columnWidth,
            height,
            energy
        );
    }
}


/* =========================================================
   AUDIO-REACTIVE VISUALIZER
========================================================= */

function drawCorruptedVisualizer(
    width,
    height
) {

    /*
        FEWER SEGMENTS.

        Sparse corrupted fragments
        instead of normal equalizer bars.
    */

    const columns =
        Math.max(
            28,
            Math.min(
                70,
                Math.floor(
                    width / 25
                )
            )
        );


    const columnWidth =
        width /
        columns;


    const binCount =
        frequencyData.length;


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        const normalized =
            i /
            columns;


        const bin =
            Math.floor(
                Math.pow(
                    normalized,
                    1.55
                ) *
                (binCount - 1)
            );


        const raw =
            frequencyData[bin] /
            255;


        const movement =
            Math.sin(
                visualizerTime *
                4.5 +
                i *
                .73
            ) *
            .025;


        const energy =
            Math.max(
                0,
                Math.min(
                    1,
                    raw +
                    movement
                )
            );


        drawCorruptedColumn(
            i,
            i * columnWidth,
            columnWidth,
            height,
            energy
        );
    }
}


/* =========================================================
   CORRUPTED GLITCH COLUMN
========================================================= */

function drawCorruptedColumn(
    index,
    x,
    columnWidth,
    height,
    energy
) {

    const totalHeight =
        Math.max(
            10,
            height *
            (
                .045 +
                energy *
                .82
            )
        );


    const top =
        height -
        totalHeight;


    /*
        Only 3–7 fragments.

        They are thin lines, NOT blocks.
    */

    const fragments =
        3 +
        Math.floor(
            energy * 4
        );


    for (
        let f = 0;
        f < fragments;
        f++
    ) {

        /*
            Deterministic pseudo-random
            positioning.
        */

        const seed =
            Math.sin(
                index *
                71.37 +
                f *
                31.19
            ) *
            43758.5453;


        const random =
            seed -
            Math.floor(
                seed
            );


        const y =
            top +
            random *
            totalHeight;


        /*
            Fragment length.
        */

        const length =
            columnWidth *
            (
                .25 +
                random *
                1.65
            );


        /*
            Horizontal displacement
            creates the corrupted look.
        */

        const displacement =
            (
                random -
                .5
            ) *
            columnWidth *
            (
                .8 +
                energy *
                2.5
            );


        /*
            Mostly 1px.
        */

        const thickness =
            random > .84
                ? 2
                : 1;


        const alpha =
            .16 +
            energy *
            .48;


        vctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${alpha}
            )`;


        /*
            Main broken fragment.
        */

        vctx.fillRect(
            x +
            displacement,

            y,

            length,

            thickness
        );


        /*
            Detached piece.
        */

        if (
            random > .56
        ) {

            const detachedLength =
                length *
                (
                    .16 +
                    random *
                    .34
                );


            vctx.fillRect(

                x +
                displacement +
                length +
                columnWidth *
                .10,

                y +
                thickness +
                1,

                detachedLength,

                1
            );
        }
    }


    /*
        Occasional long glitch slash.
    */

    const glitchSeed =
        Math.sin(
            index *
            93.17 +
            Math.floor(
                visualizerTime *
                8
            )
        ) *
        43758.5453;


    const glitchRandom =
        glitchSeed -
        Math.floor(
            glitchSeed
        );


    if (
        glitchRandom > .88 &&
        energy > .22
    ) {

        const glitchY =
            top +
            glitchRandom *
            totalHeight;


        const glitchWidth =
            columnWidth *
            (
                1 +
                energy *
                2
            );


        vctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${.20 +
                energy *
                .35}
            )`;


        vctx.fillRect(
            x -
            columnWidth,

            glitchY,

            glitchWidth,

            1
        );
    }
}


/* =========================================================
   ORNAMENT
   REMOVE BLACK ONLY
========================================================= */

const ornamentURL =
    "ornament.jpg";


function processOrnament() {

    const image =
        new Image();


    image.onload =
        function () {

            const rect =
                ornamentCanvas
                    .getBoundingClientRect();


            const cssWidth =
                rect.width;


            const cssHeight =
                rect.height;


            const ratio =
                Math.min(
                    window.devicePixelRatio ||
                    1,
                    2
                );


            ornamentCanvas.width =
                Math.max(
                    1,
                    Math.floor(
                        cssWidth *
                        ratio
                    )
                );


            ornamentCanvas.height =
                Math.max(
                    1,
                    Math.floor(
                        cssHeight *
                        ratio
                    )
                );


            ornamentCtx.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );


            /*
                Temporary canvas for
                pixel processing.
            */

            const temp =
                document.createElement(
                    "canvas"
                );


            temp.width =
                image.naturalWidth;


            temp.height =
                image.naturalHeight;


            const tempCtx =
                temp.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );


            tempCtx.drawImage(
                image,
                0,
                0
            );


            /*
                Get original pixels.
            */

            const imageData =
                tempCtx.getImageData(
                    0,
                    0,
                    temp.width,
                    temp.height
                );


            const pixels =
                imageData.data;


            /*
                REMOVE ONLY BLACK.

                We DO NOT:
                - grayscale
                - invert
                - tint
                - add grey
                - add a background

                Everything that isn't black
                stays its original color.
            */

            const blackThreshold = 24;


            for (
                let i = 0;
                i < pixels.length;
                i += 4
            ) {

                const r =
                    pixels[i];

                const g =
                    pixels[i + 1];

                const b =
                    pixels[i + 2];


                /*
                    Perceived brightness.
                */

                const brightness =
                    0.299 * r +
                    0.587 * g +
                    0.114 * b;


                if (
                    brightness <=
                    blackThreshold
                ) {

                    /*
                        BLACK → TRANSPARENT
                    */

                    pixels[i + 3] = 0;

                } else {

                    /*
                        Everything else:
                        preserve completely.
                    */

                    pixels[i + 3] =
                        pixels[i + 3];
                }
            }


            /*
                Put the transparent
                pixels back.
            */

            tempCtx.putImageData(
                imageData,
                0,
                0
            );


            /*
                CLEAR DISPLAY CANVAS.

                This is important:
                there is NO black rectangle
                behind the image.
            */

            ornamentCtx.clearRect(
                0,
                0,
                cssWidth,
                cssHeight
            );


            /*
                Draw the transparent image.
            */

            ornamentCtx.drawImage(
                temp,
                0,
                0,
                cssWidth,
                cssHeight
            );
        };


    image.onerror =
        function () {

            console.error(
                "ERROR: ornament.jpg could not be loaded."
            );

            console.error(
                "Make sure ornament.jpg is in the same folder as index.html."
            );
        };


    image.src =
        ornamentURL;
}


/* =========================================================
   INITIALIZATION
========================================================= */

window.addEventListener(
    "load",
    function () {

        resizeVisualizer();

        processOrnament();

    }
);


/*
    Re-process the ornament when
    screen dimensions change.
*/

window.addEventListener(
    "resize",
    function () {

        resizeVisualizer();

        processOrnament();

    },
    {
        passive: true
    }
);


/* =========================================================
   AUDIO CONTEXT RECOVERY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                audioContext &&
                audioContext.state ===
                "suspended"
            ) {

                try {

                    await audioContext.resume();

                } catch (_) {}
            }
        }
    }
);

</script>
