<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>fosternya.xyz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: #fff;
}

body {
    font-family: "Cinzel", Georgia, serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;

    overscroll-behavior: none;
    touch-action: manipulation;
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

#welcome {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    z-index: 10000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    cursor: pointer;
    user-select: none;

    opacity: 1;
    visibility: visible;

    transition:
        opacity .8s cubic-bezier(.77,0,.18,1),
        visibility .8s;
}

#welcome.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.welcome-content {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}


/* =========================================================
   WELCOME TITLE
========================================================= */

.welcome-title {
    position: relative;

    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size:
        clamp(
            3.2rem,
            10vw,
            9rem
        );

    line-height: .9;

    color: #fff;

    letter-spacing: .015em;

    white-space: nowrap;
}


/* RIGHT → LEFT SHINE */

.welcome-title::after {
    content: "fosternya.xyz";

    position: absolute;
    inset: 0;

    font: inherit;

    color: transparent;

    background:
        linear-gradient(
            105deg,
            transparent 40%,
            rgba(255,255,255,.95) 50%,
            transparent 60%
        );

    background-size: 260% 100%;

    background-position: 250% 0;

    -webkit-background-clip: text;
    background-clip: text;

    animation:
        titleShine
        4.5s
        cubic-bezier(.55,.05,.35,.95)
        infinite;

    pointer-events: none;
}

@keyframes titleShine {

    0% {
        background-position: 250% 0;
    }

    52%,
    100% {
        background-position: -150% 0;
    }
}


/* =========================================================
   CLICK TO ENTER
========================================================= */

.enter-text {
    margin-top: 22px;

    font-size:
        clamp(
            .55rem,
            1.1vw,
            .9rem
        );

    letter-spacing: .4em;

    color:
        rgba(
            255,
            255,
            255,
            .42
        );

    transform: translateX(.2em);

    animation:
        enterPulse
        3s
        ease-in-out
        infinite;
}

@keyframes enterPulse {

    0%,
    100% {
        opacity: .25;
    }

    50% {
        opacity: .65;
    }
}


/* =========================================================
   MAIN SITE
========================================================= */

#site {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;

    background: #000;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .9s cubic-bezier(.77,0,.18,1),
        visibility .9s;
}

#site.visible {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   VISUALIZER LAYER
========================================================= */

#visualizer-layer {
    position: absolute;
    inset: 0;

    z-index: 1;

    pointer-events: none;
    overflow: hidden;
}


/* =========================================================
   VISUALIZER CANVAS
========================================================= */

#visualizer {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    display: block;

    pointer-events: none;
}


/* =========================================================
   RIGHT → LEFT VISUALIZER SHINE
========================================================= */

.visualizer-shine {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    pointer-events: none;

    background:
        linear-gradient(
            105deg,

            transparent 0%,
            transparent 39%,

            rgba(255,255,255,.02) 46%,

            rgba(255,255,255,.14) 50%,

            rgba(255,255,255,.02) 54%,

            transparent 61%,
            transparent 100%
        );

    background-size: 260% 100%;

    background-position: 250% 0;

    animation:
        visualizerSweep
        5s
        cubic-bezier(.55,.05,.35,.95)
        infinite;

    mix-blend-mode: screen;
}

@keyframes visualizerSweep {

    0% {
        background-position: 250% 0;
    }

    100% {
        background-position: -150% 0;
    }
}


/* =========================================================
   MAIN CONTENT
========================================================= */

#content-layer {
    position: absolute;
    inset: 0;

    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.content-wrap {
    width:
        min(
            760px,
            86vw
        );

    text-align: center;

    transform:
        translateY(-7vh);
}


/* =========================================================
   MAIN TITLE
========================================================= */

.main-title {
    font-family:
        "UnifrakturCook",
        "Old English Text MT",
        serif;

    font-size:
        clamp(
            3.5rem,
            8.5vw,
            8rem
        );

    line-height: .92;

    color: #fff;

    letter-spacing: .01em;

    white-space: nowrap;
}


/* =========================================================
   CUSTOM TEXT BOX
========================================================= */

.custom-text-box {
    width:
        min(
            680px,
            100%
        );

    margin:
        clamp(
            18px,
            3vh,
            28px
        )
        auto 0;

    padding:
        clamp(
            16px,
            2vw,
            25px
        )
        clamp(
            17px,
            3vw,
            30px
        );

    background:
        rgba(
            0,
            0,
            0,
            .20
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .045
        );

    box-shadow: none;

    backdrop-filter:
        blur(2px);

    -webkit-backdrop-filter:
        blur(2px);

    color:
        rgba(
            255,
            255,
            255,
            .72
        );

    font-size:
        clamp(
            .65rem,
            1.05vw,
            .9rem
        );

    line-height: 1.85;

    letter-spacing: .045em;
}


/* =========================================================
   ORNAMENT
========================================================= */

#ornament-layer {
    position: absolute;
    inset: 0;

    z-index: 8;

    pointer-events: none;

    overflow: hidden;
}


/*
    ornament.png MUST already have
    transparency.

    No blend mode.
    No canvas processing.
    No black removal.
*/

#ornament {
    position: absolute;

    top: 0;
    right: 0;

    width:
        min(
            58vw,
            900px
        );

    height: 100%;

    object-fit: contain;
    object-position: right center;

    opacity: .95;

    filter:
        grayscale(1)
        contrast(1.05)
        brightness(1.05);

    transform-origin:
        right center;

    animation:
        ornamentFloat
        12s
        ease-in-out
        infinite;

    will-change: transform;

    user-select: none;
    -webkit-user-drag: none;
}

@keyframes ornamentFloat {

    0%,
    100% {
        transform:
            translate3d(
                0,
                0,
                0
            );
    }

    50% {
        transform:
            translate3d(
                -5px,
                0,
                0
            );
    }
}


/* =========================================================
   VIGNETTE
========================================================= */

#vignette {
    position: absolute;
    inset: 0;

    z-index: 9;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,

            transparent 43%,

            rgba(0,0,0,.08) 73%,

            rgba(0,0,0,.40) 100%
        );
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .main-title {
        font-size:
            clamp(
                3.3rem,
                10vw,
                6.5rem
            );
    }

    #ornament {
        width: 65vw;
    }
}


/* =========================================================
   PHONE
========================================================= */

@media (max-width: 700px) {

    .welcome-title {
        font-size:
            clamp(
                2.8rem,
                14vw,
                5.5rem
            );
    }

    .enter-text {
        margin-top: 19px;
        font-size: .56rem;
        letter-spacing: .29em;
    }

    .content-wrap {
        width: 88vw;

        transform:
            translateY(-5vh);
    }

    .main-title {
        font-size:
            clamp(
                2.9rem,
                14vw,
                5rem
            );

        white-space: normal;
    }

    .custom-text-box {
        margin-top: 19px;

        padding:
            17px 16px;

        font-size: .66rem;

        line-height: 1.75;
    }

    #ornament {
        width: 90vw;

        right: -24vw;

        opacity: .55;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 430px) {

    .welcome-title {
        font-size: 3rem;
    }

    .main-title {
        font-size: 3.15rem;
    }

    .custom-text-box {
        width: 92vw;

        padding:
            16px 13px;
    }

    #ornament {
        width: 105vw;

        right: -38vw;

        opacity: .42;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media
(max-height: 500px)
and
(orientation: landscape) {

    .welcome-title {
        font-size:
            clamp(
                2.7rem,
                10vh,
                5rem
            );
    }

    .enter-text {
        margin-top: 12px;
    }

    .content-wrap {
        transform:
            translateY(-3vh);
    }

    .main-title {
        font-size:
            clamp(
                2.8rem,
                13vh,
                5rem
            );
    }

    .custom-text-box {
        margin-top: 13px;

        padding:
            10px 18px;

        line-height: 1.5;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     WELCOME
======================================================= -->

<section id="welcome">

    <div class="welcome-content">

        <div class="welcome-title">
            fosternya.xyz
        </div>

        <div class="enter-text">
            click to enter
        </div>

    </div>

</section>



<!-- =======================================================
     MAIN SITE
======================================================= -->

<main id="site">


    <!-- ===================================================
         LAYER 1 — AUDIO VISUALIZER
    ==================================================== -->

    <section id="visualizer-layer">

        <canvas id="visualizer"></canvas>

        <div class="visualizer-shine"></div>

    </section>



    <!-- ===================================================
         LAYER 2 — TEXT
    ==================================================== -->

    <section id="content-layer">

        <div class="content-wrap">

            <h1 class="main-title">
                Foster, nya~!
            </h1>

            <div class="custom-text-box">
                PUT YOUR TEXT HERE
            </div>

        </div>

    </section>



    <!-- ===================================================
         LAYER 3 — TRANSPARENT PNG
    ==================================================== -->

    <section id="ornament-layer">

        <img
            id="ornament"
            src="ornament.png"
            alt=""
            draggable="false"
        >

    </section>


    <div id="vignette"></div>

</main>



<!-- =======================================================
     AUDIO
======================================================= -->

<audio
    id="music"
    preload="auto"
    playsinline>
</audio>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const welcome =
    document.getElementById(
        "welcome"
    );

const site =
    document.getElementById(
        "site"
    );

const audio =
    document.getElementById(
        "music"
    );

const canvas =
    document.getElementById(
        "visualizer"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


/* =========================================================
   TRACK SELECTION
   70% TRACK 1
   30% TRACK 2
========================================================= */

function chooseTrack() {

    return Math.random() < .70
        ? "track1.mp3"
        : "track2.mp3";
}


/* =========================================================
   AUDIO SYSTEM
========================================================= */

let audioContext = null;

let analyser = null;

let source = null;

let frequencyData = null;

let audioStarted = false;


function setupAudio() {

    if (audioContext) {
        return;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {
        return;
    }


    audioContext =
        new AudioContext();


    analyser =
        audioContext.createAnalyser();


    /*
        1024 gives enough frequency
        detail while staying lightweight.
    */

    analyser.fftSize =
        1024;


    /*
        Smooth audio response.
    */

    analyser.smoothingTimeConstant =
        .82;


    analyser.minDecibels =
        -90;


    analyser.maxDecibels =
        -10;


    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    source =
        audioContext
            .createMediaElementSource(
                audio
            );


    source.connect(
        analyser
    );


    analyser.connect(
        audioContext.destination
    );
}


/* =========================================================
   MUSIC FADE-IN
   0.5 SECOND
========================================================= */

function fadeInMusic() {

    const start =
        performance.now();

    const duration =
        500;


    function fade(now) {

        const progress =
            Math.min(
                1,
                (now - start) /
                duration
            );


        /*
            Smooth cubic easing.
        */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        audio.volume =
            .72 * eased;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                fade
            );

        } else {

            audio.volume =
                .72;
        }
    }


    requestAnimationFrame(
        fade
    );
}


/* =========================================================
   START MUSIC
========================================================= */

async function startMusic() {

    if (!audioStarted) {

        audio.src =
            chooseTrack();

        setupAudio();

        audioStarted =
            true;
    }


    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        try {

            await audioContext.resume();

        } catch (_) {}
    }


    try {

        audio.volume =
            0;

        await audio.play();

        fadeInMusic();

    } catch (error) {

        console.warn(
            "Music could not start:",
            error
        );
    }
}


/* =========================================================
   ENTER SITE
========================================================= */

let entered = false;


function enterSite() {

    if (entered) {
        return;
    }


    entered = true;


    site.classList.add(
        "visible"
    );


    welcome.classList.add(
        "hidden"
    );


    /*
        The audio begins from
        this same user click.
    */

    startMusic();


    resizeCanvas();


    requestAnimationFrame(
        visualizerLoop
    );
}


welcome.addEventListener(
    "click",
    enterSite
);


/* =========================================================
   CANVAS RESIZE
========================================================= */

let dpr = 1;


function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    /*
        Maximum DPR of 2 prevents
        4x/5x mobile displays from
        unnecessarily destroying FPS.
    */

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.max(
            1,
            Math.floor(
                rect.width *
                dpr
            )
        );


    canvas.height =
        Math.max(
            1,
            Math.floor(
                rect.height *
                dpr
            )
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* =========================================================
   BAR STATE
========================================================= */

let barValues = [];

let barVelocity = [];


/* =========================================================
   CREATE BAR STATES
========================================================= */

function setupBars(count) {

    barValues =
        new Array(count)
            .fill(0);

    barVelocity =
        new Array(count)
            .fill(0);
}


/* =========================================================
   SMOOTH SPRING PHYSICS
========================================================= */

function smoothBar(
    index,
    target
) {

    if (
        barValues[index] === undefined
    ) {

        barValues[index] =
            0;

        barVelocity[index] =
            0;
    }


    /*
        Spring force.

        Higher stiffness =
        faster response.

        Damping =
        smooth bounce.
    */

    const stiffness =
        .095;

    const damping =
        .76;


    const difference =
        target -
        barValues[index];


    barVelocity[index] +=
        difference *
        stiffness;


    barVelocity[index] *=
        damping;


    barValues[index] +=
        barVelocity[index];


    return barValues[index];
}


/* =========================================================
   VISUALIZER LOOP
========================================================= */

let visualizerTime = 0;


function visualizerLoop(
    timestamp
) {

    visualizerTime =
        timestamp *
        .001;


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        28–58 large bars depending
        on screen width.
    */

    const barCount =
        Math.max(
            28,
            Math.min(
                58,
                Math.floor(
                    width / 32
                )
            )
        );


    if (
        barValues.length !==
        barCount
    ) {

        setupBars(
            barCount
        );
    }


    if (
        analyser &&
        frequencyData
    ) {

        analyser.getByteFrequencyData(
            frequencyData
        );

        drawAudioBars(
            width,
            height,
            barCount
        );

    } else {

        drawIdleBars(
            width,
            height,
            barCount
        );
    }


    requestAnimationFrame(
        visualizerLoop
    );
}


/* =========================================================
   AUDIO BARS
========================================================= */

function drawAudioBars(
    width,
    height,
    count
) {

    const bins =
        frequencyData.length;


    const gap =
        Math.max(
            3,
            width / count * .18
        );


    const barWidth =
        Math.max(
            5,
            (
                width -
                gap *
                (count - 1)
            ) /
            count
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const normalized =
            i /
            (count - 1);


        /*
            Frequency distribution.

            Lower frequencies on the
            left, higher on the right.
        */

        const bin =
            Math.floor(
                Math.pow(
                    normalized,
                    1.45
                ) *
                (bins - 1)
            );


        let raw =
            frequencyData[bin] /
            255;


        /*
            Add a small amount of
            neighboring frequency energy.
        */

        const neighbor =
            i > 0
                ? frequencyData[
                    Math.max(
                        0,
                        bin - 3
                    )
                ] / 255
                : raw;


        raw =
            raw * .78 +
            neighbor * .22;


        /*
            Make the movement stronger.
        */

        const target =
            Math.pow(
                raw,
                .72
            );


        const smooth =
            smoothBar(
                i,
                target
            );


        /*
            Large rectangular bars.
        */

        const barHeight =
            Math.max(
                5,
                height *
                (
                    .045 +
                    smooth *
                    .86
                )
            );


        const x =
            i *
            (barWidth + gap);


        const y =
            height -
            barHeight;


        drawBar(
            x,
            y,
            barWidth,
            barHeight,
            smooth,
            i
        );
    }
}


/* =========================================================
   IDLE BARS
========================================================= */

function drawIdleBars(
    width,
    height,
    count
) {

    const gap =
        Math.max(
            3,
            width / count * .18
        );


    const barWidth =
        Math.max(
            5,
            (
                width -
                gap *
                (count - 1)
            ) /
            count
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const wave =
            (
                Math.sin(
                    visualizerTime *
                    1.4 +
                    i *
                    .35
                ) +
                1
            ) /
            2;


        const target =
            .045 +
            wave *
            .07;


        const smooth =
            smoothBar(
                i,
                target
            );


        const barHeight =
            height *
            (
                .035 +
                smooth *
                .55
            );


        const x =
            i *
            (barWidth + gap);


        const y =
            height -
            barHeight;


        drawBar(
            x,
            y,
            barWidth,
            barHeight,
            smooth,
            i
        );
    }
}


/* =========================================================
   DRAW RECTANGULAR BAR
========================================================= */

function drawBar(
    x,
    y,
    width,
    height,
    energy,
    index
) {

    /*
        PURE WHITE.

        Transparency is created
        ONLY through alpha.
    */

    const alpha =
        .12 +
        energy *
        .56;


    ctx.fillStyle =
        `rgba(
            255,
            255,
            255,
            ${alpha}
        )`;


    /*
        Main rectangle.
    */

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    /*
        Subtle corrupted cuts.

        These are actual gaps,
        not extra transparent blocks.
    */

    if (
        energy > .18
    ) {

        const glitch =
            Math.sin(
                index * 17.31 +
                Math.floor(
                    visualizerTime *
                    7
                )
            );


        if (
            glitch > .72
        ) {

            const cutHeight =
                Math.max(
                    1,
                    height *
                    .025
                );


            const cutY =
                y +
                height *
                (
                    .25 +
                    (
                        (
                            glitch + 1
                        ) /
                        2
                    ) *
                    .55
                );


            /*
                Clear a thin section
                from the rectangle.
            */
