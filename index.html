<!-- =======================================================
     AUDIO
======================================================= -->

<audio
    id="music"
    preload="auto"
    playsinline>
</audio>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const welcome =
    document.getElementById(
        "welcome"
    );

const site =
    document.getElementById(
        "site"
    );

const audio =
    document.getElementById(
        "music"
    );

const canvas =
    document.getElementById(
        "visualizer"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


/* =========================================================
   AUDIO VARIABLES
========================================================= */

let audioContext = null;

let analyser = null;

let source = null;

let frequencyData = null;

let audioStarted = false;

let audioStarting = false;


/* =========================================================
   TRACK SELECTION
   70% / 30%
========================================================= */

function chooseTrack() {

    const random =
        Math.random();

    if (random < .70) {

        return "track1.mp3";

    }

    return "track2.mp3";
}


/* =========================================================
   CREATE AUDIO SYSTEM
========================================================= */

function setupAudio() {

    if (audioContext) {
        return true;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        console.warn(
            "Web Audio API is not supported."
        );

        return false;
    }


    try {

        audioContext =
            new AudioContext();


        analyser =
            audioContext.createAnalyser();


        /*
            Higher FFT = more frequency detail.

            1024 is a good balance for
            desktop + phone.
        */

        analyser.fftSize =
            1024;


        /*
            This is what gives the bars
            their smooth movement.
        */

        analyser.smoothingTimeConstant =
            .84;


        analyser.minDecibels =
            -90;


        analyser.maxDecibels =
            -10;


        frequencyData =
            new Uint8Array(
                analyser.frequencyBinCount
            );


        /*
            IMPORTANT:

            The audio element is connected
            through the analyser AND then
            to the speakers.

            This allows the visualizer to
            hear exactly what the user hears.
        */

        source =
            audioContext
                .createMediaElementSource(
                    audio
                );


        source.connect(
            analyser
        );


        analyser.connect(
            audioContext.destination
        );


        return true;

    } catch (error) {

        console.error(
            "Audio setup failed:",
            error
        );

        return false;
    }
}


/* =========================================================
   FADE IN
   0 → 72% IN 500MS
========================================================= */

function fadeInMusic() {

    const start =
        performance.now();

    const duration =
        500;


    function fade(now) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                duration
            );


        /*
            Cubic ease-out.
        */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        audio.volume =
            .72 *
            eased;


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                fade
            );

        } else {

            audio.volume =
                .72;
        }
    }


    requestAnimationFrame(
        fade
    );
}


/* =========================================================
   START AUDIO
========================================================= */

async function startMusic() {

    /*
        Prevent multiple simultaneous
        initialization attempts.
    */

    if (
        audioStarted ||
        audioStarting
    ) {

        return;
    }


    audioStarting =
        true;


    /*
        Pick ONE track.

        It will not randomly switch
        halfway through.
    */

    audio.src =
        chooseTrack();


    /*
        Prepare analyser before playback.
    */

    const ready =
        setupAudio();


    if (!ready) {

        audioStarting =
            false;

        return;
    }


    try {

        /*
            Mobile browsers can leave
            AudioContext suspended until
            user interaction.
        */

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();
        }


        /*
            Start completely silent.
        */

        audio.volume =
            0;


        await audio.play();


        audioStarted =
            true;

        audioStarting =
            false;


        /*
            0.5 second fade.
        */

        fadeInMusic();

    } catch (error) {

        audioStarting =
            false;

        console.warn(
            "Browser blocked audio:",
            error
        );
    }
}


/* =========================================================
   ENTER SITE
========================================================= */

let entered = false;


function enterSite() {

    if (entered) {
        return;
    }


    entered = true;


    /*
        Open main page.
    */

    site.classList.add(
        "visible"
    );


    /*
        Hide welcome screen.
    */

    welcome.classList.add(
        "hidden"
    );


    /*
        Start audio directly from
        the click event.

        This is important for iOS,
        Android and Chrome autoplay rules.
    */

    startMusic();


    resizeCanvas();


    /*
        Start visualizer exactly once.
    */

    requestAnimationFrame(
        visualizerLoop
    );
}


welcome.addEventListener(
    "click",
    enterSite
);


/* =========================================================
   CANVAS RESIZE
========================================================= */

let dpr = 1;


function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    /*
        Limit DPR to 2.

        Prevents 3x/4x phone displays
        from creating enormous canvases.
    */

    dpr =
        Math.min(
            window.devicePixelRatio ||
            1,
            2
        );


    canvas.width =
        Math.max(
            1,
            Math.floor(
                rect.width *
                dpr
            )
        );


    canvas.height =
        Math.max(
            1,
            Math.floor(
                rect.height *
                dpr
            )
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* =========================================================
   BAR PHYSICS
========================================================= */

let barValues = [];

let barVelocity = [];


function initializeBars(
    count
) {

    barValues =
        new Array(count)
            .fill(.03);


    barVelocity =
        new Array(count)
            .fill(0);
}


/* =========================================================
   SPRING BAR MOVEMENT
========================================================= */

function updateBar(
    index,
    target
) {

    if (
        barValues[index] ===
        undefined
    ) {

        barValues[index] =
            .03;

        barVelocity[index] =
            0;
    }


    /*
        Spring stiffness.

        The bars chase the music
        instead of snapping to it.
    */

    const stiffness =
        .11;


    /*
        Velocity damping.

        Lower = more bounce.
        Higher = smoother.
    */

    const damping =
        .78;


    const difference =
        target -
        barValues[index];


    barVelocity[index] +=
        difference *
        stiffness;


    barVelocity[index] *=
        damping;


    barValues[index] +=
        barVelocity[index];


    /*
        Prevent tiny negative values.
    */

    if (
        barValues[index] < 0
    ) {

        barValues[index] = 0;
    }


    return barValues[index];
}


/* =========================================================
   VISUALIZER LOOP
========================================================= */

let lastVisualizerTime =
    0;


function visualizerLoop(
    timestamp
) {

    /*
        Keep a timestamp so the
        animation remains frame-rate
        independent.
    */

    lastVisualizerTime =
        timestamp;


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Fewer, larger bars.

        ~28 on a small screen,
        up to ~58 on desktop.
    */

    const count =
        Math.max(
            28,
            Math.min(
                58,
                Math.floor(
                    width / 32
                )
            )
        );


    if (
        barValues.length !==
        count
    ) {

        initializeBars(
            count
        );
    }


    if (
        analyser &&
        frequencyData
    ) {

        analyser.getByteFrequencyData(
            frequencyData
        );


        drawAudioBars(
            width,
            height,
            count
        );

    } else {

        drawIdleBars(
            width,
            height,
            count
        );
    }


    /*
        Synchronizes to the display's
        actual refresh rate.

        60Hz → ~60 FPS
        120Hz → ~120 FPS
        144Hz → ~144 FPS
    */

    requestAnimationFrame(
        visualizerLoop
    );
}


/* =========================================================
   AUDIO BARS
========================================================= */

function drawAudioBars(
    width,
    height,
    count
) {

    const bins =
        frequencyData.length;


    /*
        Space between bars.
    */

    const gap =
        Math.max(
            4,
            width / count * .20
        );


    const barWidth =
        Math.max(
            6,
            (
                width -
                gap *
                (count - 1)
            ) /
            count
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const position =
            i /
            (count - 1);


        /*
            Map bars to the frequency
            spectrum.

            Lower frequencies are given
            slightly more space.
        */

        const bin =
            Math.floor(
                Math.pow(
                    position,
                    1.45
                ) *
                (bins - 1)
            );


        let level =
            frequencyData[bin] /
            255;


        /*
            Mix in nearby frequencies.

            This prevents individual bars
            from flickering independently.
        */

        const nearby =
            i > 0
                ? frequencyData[
                    Math.max(
                        0,
                        bin - 3
                    )
                ] / 255
                : level;


        level =
            level * .78 +
            nearby * .22;


        /*
            Non-linear response makes
            quieter music visible.
        */

        const target =
            Math.pow(
                level,
                .72
            );


        const smooth =
            updateBar(
                i,
                target
            );


        /*
            Bars fill roughly the entire
            50% visualizer area.
        */

        const barHeight =
            Math.max(
                7,
                height *
                (
                    .045 +
                    smooth *
                    .88
                )
            );


        const x =
            i *
            (
                barWidth +
                gap
            );


        const y =
            height -
            barHeight;


        drawRoundedBar(
            x,
            y,
            barWidth,
            barHeight,
            smooth,
            i
        );
    }
}


/* =========================================================
   IDLE BARS
========================================================= */

function drawIdleBars(
    width,
    height,
    count
) {

    const gap =
        Math.max(
            4,
            width / count * .20
        );


    const barWidth =
        Math.max(
            6,
            (
                width -
                gap *
                (count - 1)
            ) /
            count
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const wave =
            (
                Math.sin(
                    performance.now() *
                    .0013 +
                    i *
                    .32
                ) +
                1
            ) /
            2;


        const target =
            .035 +
            wave *
            .065;


        const smooth =
            updateBar(
                i,
                target
            );


        const barHeight =
            height *
            (
                .04 +
                smooth *
                .7
            );


        const x =
            i *
            (
                barWidth +
                gap
            );


        const y =
            height -
            barHeight;


        drawRoundedBar(
            x,
            y,
            barWidth,
            barHeight,
            smooth,
            i
        );
    }
}


/* =========================================================
   ROUNDED RECTANGULAR BAR
========================================================= */

function drawRoundedBar(
    x,
    y,
    width,
    height,
    energy,
    index
) {

    /*
        PURE WHITE.

        Alpha gives the transparent look.
    */

    const alpha =
        .14 +
        energy *
        .58;


    ctx.fillStyle =
        `rgba(
            255,
            255,
            255,
            ${alpha}
        )`;


    /*
        Rounded corners.

        Larger bars = visibly rounded.
    */

    const radius =
        Math.min(
            width * .30,
            9
        );


    ctx.beginPath();


    /*
        roundRect is supported by
        modern Chrome, Edge, Safari
        and Firefox.
    */

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );


    ctx.fill();


    /* =====================================================
       CORRUPTION
    ===================================================== */


    if (
        energy > .25
    ) {

        const glitch =
            Math.sin(
                index * 17.31 +
                Math.floor(
                    performance.now() *
                    .007
                )
            );


        /*
            Cut a tiny piece from
            the rectangle.
        */

        if (
            glitch > .72 &&
            height > 20
        ) {

            const cutHeight =
                Math.max(
                    1,
                    height * .018
                );


            const cutY =
                y +
                height *
                (
                    .25 +
                    (
                        glitch + 1
                    ) /
                    2 *
                    .55
                );


            ctx.clearRect(
                x,
                cutY,
                width *
                (
                    .35 +
                    energy *
                    .55
                ),
                cutHeight
            );
        }
    }


    /*
        Small detached glitch line.
    */

    if (
        energy > .42
    ) {

        const glitch2 =
            Math.sin(
                index * 41.73 +
                Math.floor(
                    performance.now() *
                    .005
                )
            );


        if (
            glitch2 > .84
        ) {

            ctx.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${.16 + energy * .38}
                )`;


            ctx.fillRect(
                x -
                width * .16,

                y +
                height * .20,

                width *
                .55,

                Math.max(
                    1,
                    height * .012
                )
            );
        }
    }
}


/* =========================================================
   INITIALIZATION
========================================================= */

window.addEventListener(
    "load",
    () => {

        resizeCanvas();

    }
);


/* =========================================================
   AUDIO RECOVERY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                audioContext &&
                audioContext.state ===
                "suspended"
            ) {

                try {

                    await audioContext.resume();

                } catch (_) {}
            }
        }
    }
);

</script>
