<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>neoperro</title>
  <style>
    @font-face { font-family: Highcrest; src: url('/Highcrest.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #000; color: #eeebe5; }
    main { width: min(92vw, 650px); display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0; }
    .logo { position: relative; width: 220px; height: 80px; overflow: hidden; }
    .logo img { position: absolute; left: 50%; top: 50%; display: block; width: 1280px; max-width: none; transform: translate(-52.1%, -36.1%); }
    h1 { margin: 0; font-family: Highcrest, Georgia, serif; font-size: clamp(40px, 10vw, 100px); font-weight: 400; line-height: 2; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <img src="https://raw.githubusercontent.com/kasztingers11-lang/mysite/b2d6c13c7ee8030d8a1ff09da60386b9229ad61e/neoperro-intro/assets/neoperro-cat.png" width="1280" height="1280" alt="Neoperro cat logo">
    </div>
    <h1>neoperro</h1>
  </main>
</body>
</html>
